<style>
html{direction:rtl}
/* Layout: one-column phone app, scrolling screen above a fixed tab bar; overlays slide over it. */
:root {
  --bg: #F4F6F3;
  --surface: #FFFFFF;
  --surface-2: #E8EDE9;
  --ink: #16201A;
  --muted: #56615A;
  --line: #E1E7E2;
  --accent: #1F6B4A;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEBE1;
  --accent-text: #1A5C3F;
  --warn-bg: #FBE3D2;
  --warn-ink: #7E3208;
  --low-bg: #FFF1DA;
  --low-ink: #5C3D06;
  --saffron: #F2B544;
  --saffron-ink: #2A1B00;
  --shadow: rgba(22, 32, 26, 0.08);
  --backdrop: rgba(10, 18, 13, 0.42);
  --t-saudi: #DCEBE1; --t-saudi-ink: #1F6B4A;
  --t-shaabi: #F6E1D3; --t-shaabi-ink: #8A3B0C;
  --t-arab: #ECE6D6; --t-arab-ink: #6B5A2E;
  --t-intl: #E2E6F1; --t-intl-ink: #3A4472;
  --cook-bg: #0F2A1F;
  --cook-surface: #1B3D2F;
  --cook-ink: #F2F6F3;
  --cook-muted: #A9C2B5;
  --cook-track: #2C4A3B;
  --font: 'Readex Pro', 'SF Arabic', 'Geeza Pro', 'Segoe UI', Tahoma, system-ui, sans-serif;
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1512; --surface: #18201B; --surface-2: #232D27; --ink: #E8EEE9; --muted: #A2B0A7; --line: #2A352E;
    --accent: #5CC08F; --accent-ink: #08160F; --accent-soft: #1E3A2C; --accent-text: #86D7AE;
    --warn-bg: #3A2416; --warn-ink: #F4B58C; --low-bg: #382C12; --low-ink: #F2CF86;
    --shadow: rgba(0, 0, 0, 0.35); --backdrop: rgba(0, 0, 0, 0.6);
    --t-saudi: #1E3A2C; --t-saudi-ink: #86D7AE; --t-shaabi: #3A281C; --t-shaabi-ink: #F0B48C;
    --t-arab: #2F2A1E; --t-arab-ink: #DCCB98; --t-intl: #1F2535; --t-intl-ink: #A9B5E6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1512; --surface: #18201B; --surface-2: #232D27; --ink: #E8EEE9; --muted: #A2B0A7; --line: #2A352E;
  --accent: #5CC08F; --accent-ink: #08160F; --accent-soft: #1E3A2C; --accent-text: #86D7AE;
  --warn-bg: #3A2416; --warn-ink: #F4B58C; --low-bg: #382C12; --low-ink: #F2CF86;
  --shadow: rgba(0, 0, 0, 0.35); --backdrop: rgba(0, 0, 0, 0.6);
  --t-saudi: #1E3A2C; --t-saudi-ink: #86D7AE; --t-shaabi: #3A281C; --t-shaabi-ink: #F0B48C;
  --t-arab: #2F2A1E; --t-arab-ink: #DCCB98; --t-intl: #1F2535; --t-intl-ink: #A9B5E6;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; overscroll-behavior: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { height: 100%; max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; position: relative; background: var(--bg); }
.screen { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 16px;
  padding-block: calc(22px + env(safe-area-inset-top, 0px)) 28px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }

/* ===== الرأس ===== */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.top > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.top h1 { margin: 0; font-size: 27px; font-weight: 700; line-height: 1.3; }
.top p { margin: 0; font-size: 14px; color: var(--muted); }
.iconbtn { width: 46px; height: 46px; flex-shrink: 0; border: none; border-radius: var(--r-md); background: var(--surface); color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px var(--shadow); }
.btn { height: 46px; padding: 0 16px; border-radius: 14px; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14.5px; font-weight: 600; flex-shrink: 0; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn-soft { background: var(--accent-soft); color: var(--accent-text); }
.btn-danger { background: var(--warn-bg); color: var(--warn-ink); }
.btn-block { width: 100%; height: 54px; border-radius: 18px; font-size: 16px; }
.btn-sm { height: 36px; padding: 0 12px; font-size: 13px; border-radius: 12px; }
.link { border: none; background: none; color: var(--accent-text); font-weight: 600; font-size: 13.5px; padding: 6px 4px; min-height: 36px; }

.search { display: flex; align-items: center; gap: 10px; height: 48px; flex-shrink: 0; padding: 0 16px; background: var(--surface); border-radius: var(--r-md); color: var(--muted); box-shadow: 0 1px 2px var(--shadow); }
.search input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 15px; color: var(--ink); }
.search input::placeholder { color: var(--muted); }

.chips-row { display: flex; gap: 8px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; margin-inline: -18px; padding-inline: 18px; }
.chips-row::-webkit-scrollbar { display: none; }
.chip { height: 38px; flex-shrink: 0; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.chip .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--saffron); color: var(--saffron-ink); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }

.seg { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 14px; flex-shrink: 0; }
.seg button { flex: 1; height: 38px; border: none; border-radius: 11px; background: transparent; color: var(--muted); font-size: 13.5px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px var(--shadow); }

.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 4px; }
.sec-h h2 { margin: 0; font-size: 18px; font-weight: 600; }
.sec-h span { font-size: 13px; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 10px; }

/* ===== بطاقات الوصفات ===== */
.tile { flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--t-saudi); color: var(--t-saudi-ink); }
.tile.shaabi { background: var(--t-shaabi); color: var(--t-shaabi-ink); }
.tile.arab { background: var(--t-arab); color: var(--t-arab-ink); }
.tile.intl { background: var(--t-intl); color: var(--t-intl-ink); }
.feat { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-lg); overflow: hidden; box-shadow: 0 1px 3px var(--shadow); border: none; padding: 0; text-align: right; width: 100%; }
.feat .tile { height: 116px; position: relative; font-size: 34px; font-weight: 700; }
.feat .tile .pill { position: absolute; top: 12px; right: 12px; }
.feat .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.feat .name { font-size: 18px; font-weight: 600; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface); border-radius: 18px; box-shadow: 0 1px 2px var(--shadow); width: 100%; text-align: right; border: none; }
.row .tile { width: 52px; height: 52px; border-radius: 14px; font-size: 20px; font-weight: 700; }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row .name { font-size: 15.5px; font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }
.meta span { display: inline-flex; align-items: center; gap: 4px; }
.miss { font-size: 12.5px; color: var(--warn-ink); display: flex; align-items: center; gap: 6px; }
.miss::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.pill { height: 26px; padding: 0 10px; border-radius: 9px; background: var(--surface); color: var(--accent-text); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.pill.soft { background: var(--accent-soft); }
.pill.low { background: var(--low-bg); color: var(--low-ink); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
.pill.gray { background: var(--surface-2); color: var(--muted); font-weight: 500; }
.okdot { width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: inline-flex; align-items: center; justify-content: center; }

.banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: none; background: var(--low-bg); border-radius: var(--r-md); color: var(--low-ink); text-align: right; width: 100%; flex-shrink: 0; }
.banner .ico { width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; background: var(--saffron); color: var(--saffron-ink); display: flex; align-items: center; justify-content: center; }
.banner .txt { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.banner b { font-size: 14px; font-weight: 600; }
.banner small { font-size: 12.5px; }
.banner.on { outline: 2px solid var(--saffron); }

.empty { padding: 22px 18px; border-radius: var(--r-lg); border: 1.5px dashed var(--line); text-align: center; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty b { color: var(--ink); font-size: 16px; }
.note { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; border: 1px dashed var(--line); color: var(--muted); font-size: 13px; }
.note span { flex: 1; }
.tip { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-text); font-size: 13px; line-height: 1.6; }
.demo { padding: 10px 14px; border-radius: 14px; background: var(--low-bg); color: var(--low-ink); font-size: 13px; display: flex; align-items: center; gap: 10px; }
.demo span { flex: 1; }

/* ===== المطبخ ===== */
.group { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px; background: var(--surface); border-radius: 20px; box-shadow: 0 1px 2px var(--shadow); }
.group-h { display: flex; justify-content: space-between; align-items: baseline; }
.group-h h3 { margin: 0; font-size: 15px; font-weight: 600; }
.group-h span { font-size: 12.5px; color: var(--muted); }
.wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.ing { min-height: 38px; padding: 0 12px; border: none; border-radius: var(--r-sm); background: var(--surface-2); color: var(--ink); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.ing small { font-size: 12px; }
.ing.low { background: var(--low-bg); color: var(--low-ink); }
.ing.warn { background: var(--warn-bg); color: var(--warn-ink); }
.ing.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.75; }
.ing.pick { background: var(--surface); border: 1px solid var(--line); }
.ing.pick.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* ===== المشتريات ===== */
.shop-h { margin: 0 4px 2px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.box { display: flex; flex-direction: column; background: var(--surface); border-radius: 20px; overflow: hidden; box-shadow: 0 1px 2px var(--shadow); }
.check { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.check:last-child { border-bottom: none; }
.check input { position: absolute; opacity: 0; pointer-events: none; }
.check .box-ui { width: 24px; height: 24px; flex-shrink: 0; border-radius: 8px; border: 2px solid var(--line); display: inline-flex; align-items: center; justify-content: center; color: transparent; }
.check input:checked + .box-ui { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check input:focus-visible + .box-ui { outline: 2px solid var(--accent); outline-offset: 2px; }
.check .nm { flex: 1; min-width: 0; font-size: 15.5px; }
.check .from { font-size: 12.5px; color: var(--muted); text-align: left; }
.check.done .nm { color: var(--muted); text-decoration: line-through; }
.check .gone { font-size: 12px; color: var(--accent-text); display: inline-flex; align-items: center; gap: 4px; }
.add-line { display: flex; gap: 8px; }
.add-line .search { flex: 1; color: var(--accent-text); }

/* ===== التبويبات ===== */
.nav { flex-shrink: 0; height: calc(74px + var(--sb)); background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 6px; padding-bottom: var(--sb); position: relative;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
html { background: var(--surface); }
.nav button { min-width: 68px; min-height: 54px; border: none; background: none; color: var(--muted); font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; }
.nav button[aria-current="page"] { color: var(--accent-text); font-weight: 600; }
.nav .cnt { position: absolute; top: 2px; left: 14px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--saffron); color: var(--saffron-ink); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

/* ===== صفحات فوق التطبيق ===== */
.page { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; justify-content: center; animation: up 0.22s ease-out; }
.page-in { width: 100%; max-width: 540px; height: 100%; display: flex; flex-direction: column; background: var(--surface); position: relative;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@keyframes up { from { transform: translateY(14px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.hero { height: 190px; flex-shrink: 0; position: relative; font-size: 54px; font-weight: 700; }
.hero .iconbtn { position: absolute; top: 16px; }
.hero .back { right: max(16px, env(safe-area-inset-right, 0px)); }
.hero .fav { left: max(16px, env(safe-area-inset-left, 0px)); }
.fav[aria-pressed="true"] { color: #C2412B; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; margin-top: -26px; position: relative; background: var(--surface); border-radius: 26px 26px 0 0;
  padding-block: 22px 24px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.title-row h1 { margin: 0; font-size: 25px; font-weight: 700; line-height: 1.35; }
.persons { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--bg); border-radius: 18px; }
.persons .txt { flex: 1; display: flex; flex-direction: column; }
.persons b { font-size: 14.5px; font-weight: 600; }
.persons small { font-size: 12px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
.stepper button.plus { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stepper output { min-width: 24px; text-align: center; font-size: 20px; font-weight: 700; }
.ing-list { list-style: none; margin: 0; padding: 0; }
.ing-list li { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.ing-list li:last-child { border-bottom: none; }
.ing-list .nm { flex: 1; min-width: 0; font-size: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ing-list .q { font-size: 14px; color: var(--muted); }
.st { width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.st.ok { background: var(--accent-soft); color: var(--accent-text); }
.st.no { border: 1.5px dashed var(--warn-ink); color: var(--warn-ink); }
.st.opt { border: 1.5px dashed var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: s; }
.steps li { display: flex; gap: 12px; align-items: flex-start; counter-increment: s; }
.steps li::before { content: counter(s); width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: var(--surface-2); font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.steps p { margin: 0; flex: 1; }
.steps small { color: var(--muted); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.cta { flex-shrink: 0; padding-block: 12px 14px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); background: var(--surface); display: flex; gap: 10px; }
.cta .btn-block { flex: 1; }
.plain-h { display: flex; align-items: center; gap: 12px; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); flex-shrink: 0; }
.plain-h h1 { margin: 0; font-size: 19px; font-weight: 600; flex: 1; }
.plain-h .iconbtn { box-shadow: none; background: var(--bg); width: 42px; height: 42px; }
.form { display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .lbl { font-size: 13.5px; font-weight: 600; color: var(--muted); }
.input { height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 15px; width: 100%; min-width: 0; }
textarea.input { height: auto; min-height: 70px; padding: 10px 14px; resize: vertical; line-height: 1.6; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ed-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 92px 40px; gap: 6px; align-items: center; }
.ed-row .input { height: 44px; padding: 0 10px; font-size: 14px; }
.ed-sub { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); margin-top: -2px; }
.ed-step { display: grid; grid-template-columns: minmax(0, 1fr) 70px 40px; gap: 6px; align-items: start; }
.x { width: 40px; height: 44px; border: none; border-radius: 12px; background: var(--bg); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.set-sec { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 20px; background: var(--bg); }
.set-sec h2 { margin: 0; font-size: 15.5px; font-weight: 600; }
.set-sec p { margin: 0; font-size: 13px; color: var(--muted); }
.set-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }

/* وش أطبخ؟ — المنطق (بدون واجهة) */
var Logic = (function () {
  var DAY = 86400000;
  var COUNT_UNITS = ['حبة', 'فص', 'رغيف', 'شريحة', 'عود', 'ورقة', 'علبة'];
  var FRACT_UNITS = ['كوب', 'م.ك', 'م.ص', 'ربطة'];
  var FIXED_UNITS = ['رشة', 'حسب الرغبة'];

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function norm(s) {
    return String(s || '')
      .replace(/[ً-ٰٟـ]/g, '')
      .replace(/[أإآٱ]/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/ى/g, 'ي')
      .replace(/ؤ/g, 'و')
      .replace(/ئ/g, 'ي')
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase();
  }
  function stripAl(s) {
    return s.split(' ').map(function (w) { return w.length > 3 && w.indexOf('ال') === 0 ? w.slice(2) : w; }).join(' ');
  }

  function lev(a, b) {
    if (a === b) return 0;
    var m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    var prev = [], cur = [], i, j;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur = [i];
      for (j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[n];
  }

  function newState() {
    return {
      v: 1,
      onboarded: false,
      pantry: {},
      basics: DATA.BASICS.slice(),
      customIngs: {},
      shopping: [],
      history: [],
      favs: {},
      myRecipes: [],
      settings: { persons: 4, voice: false }
    };
  }

  function fixState(s) {
    var base = newState();
    if (!s || typeof s !== 'object') return base;
    Object.keys(base).forEach(function (k) { if (s[k] === undefined) s[k] = base[k]; });
    if (!s.settings.persons) s.settings.persons = 4;
    return s;
  }

  function ing(state, id) {
    return DATA.INGS[id] || (state && state.customIngs[id]) || null;
  }
  function ingName(state, id) {
    var x = ing(state, id);
    return x ? x.name : id;
  }
  function allIngs(state) {
    var out = [];
    Object.keys(DATA.INGS).forEach(function (k) { out.push(DATA.INGS[k]); });
    Object.keys(state.customIngs || {}).forEach(function (k) { out.push(state.customIngs[k]); });
    return out;
  }
  function allRecipes(state) {
    return DATA.RECIPES.concat(state.myRecipes || []);
  }
  function recipe(state, id) {
    var all = allRecipes(state);
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return null;
  }

  // البحث عن مكون بالاسم أو المرادف، مع اقتراحات "تقصد كذا؟"
  function findIng(state, query) {
    var q = stripAl(norm(query));
    if (!q) return { exact: null, matches: [], fuzzy: [] };
    var list = allIngs(state);
    var exact = null, matches = [], fuzzy = [];
    list.forEach(function (x) {
      var names = [x.name].concat(x.syn || []).map(function (n) { return stripAl(norm(n)); });
      if (names.indexOf(q) >= 0) { exact = exact || x; }
      if (names.some(function (n) { return n.indexOf(q) >= 0 || (q.length >= 3 && q.indexOf(n) >= 0); })) matches.push(x);
      else {
        var best = Math.min.apply(null, names.map(function (n) { return lev(n, q); }));
        var tol = q.length <= 3 ? 1 : 2;
        if (best <= tol) fuzzy.push({ x: x, d: best });
      }
    });
    fuzzy.sort(function (a, b) { return a.d - b.d; });
    return { exact: exact, matches: matches.slice(0, 8), fuzzy: fuzzy.slice(0, 4).map(function (f) { return f.x; }) };

  function addCustomIng(state, name, cat) {

    state.customIngs[id] = { id: id, name: String(name).trim(), cat: cat || 'other', perish: 0, syn: [], custom: true };
    return state.customIngs[id];
  }

  // ===== المطبخ =====
  function status(state, id) {
    if (state.basics.indexOf(id) >= 0) return 'basic';
    var p = state.pantry[id];
    return p ? p.status : null;
  }
  function has(state, id) {
    var s = status(state, id);
    return s === 'basic' || s === 'have' || s === 'low';
  }
  function setPantry(state, id, st, now) {
    now = now || Date.now();
    var cur = state.pantry[id];
    var x = ing(state, id);
    if (!cur) {
      cur = state.pantry[id] = { addedAt: now, expiresAt: null, status: 'have', updatedAt: now };
      if (x && x.perish) cur.expiresAt = now + x.perish * DAY;
    }
    cur.status = st || 'have';
    cur.updatedAt = now;

  }
  function restock(state, id, now) {

    delete state.pantry[id];
    return setPantry(state, id, 'have', now);
  }
  function removePantry(state, id) {

  }
  function setExpiry(state, id, days, now) {
    now = now || Date.now();
    var p = state.pantry[id];
    if (!p) return;
    p.expiresAt = days == null ? null : startOfDay(now) + days * DAY + DAY - 1;

    if (n === 2) return 'يومين';
    if (n <= 10) return n + ' أيام';

  function analyze(state, r, now) {

    r.ing.forEach(function (x) {
      var s = status(state, x.id);
      if (s === 'basic' || s === 'have' || s === 'low') {
        if (s === 'low') a.low.push(x.id);
        if (exp.indexOf(x.id) >= 0) a.expiring.push(x.id);
      } else if (x.opt) a.missingOpt.push(x.id);
      else a.missingReq.push(x.id);

    return a;
  }

  function lastCooked(state, rid) {
    var t = 0;

    return t || null;

  function relDays(ts, now) {

    if (d <= 0) return 'اليوم';
    if (d === 1) return 'أمس';
    if (d === 2) return 'قبل يومين';
    if (d <= 10) return 'قبل ' + d + ' أيام';
    return 'قبل ' + d + ' يوم';
  }

  function matchesFilters(state, r, f) {
    if (f.meal && r.meals.indexOf(f.meal) < 0) return false;
    if (f.maxTime && r.time > f.maxTime) return false;
    if (f.diff && r.diff !== f.diff) return false;
    if (f.cuisine && r.cuisine !== f.cuisine) return false;
    if (f.q) {
      var q = stripAl(norm(f.q));
      var hay = [r.name].concat(r.ing.map(function (x) { return ingName(state, x.id); })).map(function (s) { return stripAl(norm(s)); });
      if (!hay.some(function (h) { return h.indexOf(q) >= 0; })) return false;
    }
    return true;
  }

  function suggest(state, f, now) {
    now = now || Date.now();
    f = f || {};
    var ready = [], near = [];
    allRecipes(state).forEach(function (r) {
      if (!matchesFilters(state, r, f)) return;
      var a = analyze(state, r, now);
      if (f.useExpiring && !a.expiring.length) return;
      var lc = lastCooked(state, r.id);
      var recent = lc && (now - lc) < 3 * DAY;
      var score = a.expiring.length * 10 - (recent ? 15 : 0) - r.time / 30 + (state.favs[r.id] ? 2 : 0);
      var item = { r: r, a: a, score: score, last: lc };
      if (a.ready) ready.push(item);
      else if (a.missingReq.length <= 2) near.push(item);
    });
    ready.sort(function (x, y) { return y.score - x.score; });
    near.sort(function (x, y) {
      return (x.a.missingReq.length - y.a.missingReq.length) || (y.score - x.score);
    });
    return { ready: ready, near: near };
  }

  // ===== الكميات =====
  function roundTo(v, step) { return Math.round(v / step) * step; }
  function scaleOne(state, x, factor) {
    var unit = x.unit, qty = x.qty;
    if (qty == null || FIXED_UNITS.indexOf(unit) >= 0 || factor === 1) return { qty: qty, unit: unit };
    var info = ing(state, x.id);
    var spicy = (info && info.cat === 'spice') || unit === 'عود' || unit === 'ورقة';
    var v = spicy ? qty * Math.pow(factor, 0.75) : qty * factor;
    if (unit === 'كجم') {
      if (v < 1) { unit = 'جرام'; v = v * 1000; }
      else v = Math.max(0.25, roundTo(v, 0.25));
    }
    if (unit === 'جرام') {
      if (v >= 1000) { unit = 'كجم'; v = Math.max(1, roundTo(v / 1000, 0.25)); }
      else v = Math.max(10, roundTo(v, v < 100 ? 10 : 50));
    } else if (COUNT_UNITS.indexOf(unit) >= 0) {
      v = v < 3 ? Math.max(0.5, roundTo(v, 0.5)) : Math.round(v);
    } else if (FRACT_UNITS.indexOf(unit) >= 0) {
      v = Math.max(0.25, roundTo(v, 0.25));
    } else if (unit !== 'كجم') {
      v = Math.round(v * 100) / 100;
    }
    return { qty: v, unit: unit };
  }
  function fmtNum(v) {
    var whole = Math.floor(v + 1e-9), frac = Math.round((v - whole) * 100) / 100;
    var glyph = { 0.25: '¼', 0.5: '½', 0.75: '¾' }[frac];
    if (glyph) return (whole ? whole : '') + glyph;
    if (frac === 0) return String(whole);
    return String(Math.round(v * 100) / 100);
  }
  function fmtQty(q) {
    if (q.qty == null) return q.unit || 'حسب الرغبة';
    return fmtNum(q.qty) + (q.unit ? ' ' + q.unit : '');
  }

  // ===== قائمة المشتريات =====
  function addShopping(state, opts, now) {
    now = now || Date.now();
    var name = (opts.name || (opts.ingId && ingName(state, opts.ingId)) || '').trim();
    if (!name) return null;
    var existing = state.shopping.filter(function (s) {
      return !s.done && ((opts.ingId && s.ingId === opts.ingId) || norm(s.name) === norm(name));
    })[0];
    if (existing) {
      if (opts.from && existing.from.indexOf(opts.from) < 0) existing.from.push(opts.from);
      existing.updatedAt = now;
      return existing;
    }
    var info = opts.ingId ? ing(state, opts.ingId) : null;
    var item = {
      id: uid(), ingId: opts.ingId || null, name: name, cat: info ? info.cat : (opts.cat || 'other'),
      from: opts.from ? [opts.from] : [], done: false, doneAt: null, updatedAt: now
    };
    state.shopping.push(item);
    return item;
  }
  function toggleShopping(state, id, now) {

    it.done = !it.done;

  }

  }

  }

  function setDraftField(d, path, el) {
    var parts = path.split('.');
    var v = el.type === 'checkbox' ? el.checked : el.value;
    if (parts.length === 1) d[parts[0]] = v;
    else d[parts[0]][+parts[1]][parts[2]] = v;
  }
  function saveDraft(d) {
    var name = String(d.name).trim();
    var ings = d.ing.filter(function (x) { return String(x.name).trim(); });
    var steps = d.steps.filter(function (s) { return String(s.t).trim(); });
    if (!name) return 'اكتب اسم الطبق.';
    if (!d.meals.length) return 'اختر وجبة وحدة على الأقل.';
    if (!ings.length) return 'أضف مكون واحد على الأقل.';
    if (!steps.length) return 'أضف خطوة وحدة على الأقل.';
    var time = parseInt(toDigits(d.time), 10), serves = parseInt(toDigits(d.serves), 10);
    if (!(time > 0)) return 'اكتب الوقت الكلي بالدقائق.';
    if (!(serves > 0)) return 'اكتب عدد الأشخاص اللي تكفيهم.';
    var seen = {};
    var ingOut = [];
    ings.forEach(function (x) {
      var f = L.findIng(S, x.name);
      var info = f.exact || L.addCustomIng(S, x.name, 'other');
      if (seen[info.id]) return;
      seen[info.id] = 1;
      var q = parseQty(x.qty);
      ingOut.push({ id: info.id, qty: x.unit === 'حسب الرغبة' || x.unit === 'رشة' ? (q || null) : q, unit: x.unit, opt: !!x.opt });
    });
    var stepOut = steps.map(function (s) {
      var t = String(s.t).trim(), nt = L.norm(t);
      var used = ingOut.filter(function (x) {
        var n = L.norm(L.ingName(S, x.id));
        return nt.indexOf(n) >= 0 || nt.indexOf(n.split(' ')[0]) >= 0 && n.split(' ')[0].length > 2;
      }).map(function (x) { return x.id; });
      return { t: t, min: parseInt(toDigits(s.min), 10) || 0, ing: used };
    });
    var r = { id: d.id || 'm_' + L.uid(), name: name, cuisine: d.cuisine, meals: d.meals.slice(), time: time, diff: +d.diff || 1, serves: serves, src: 'mine', ing: ingOut, steps: stepOut, updatedAt: Date.now() };
    var i = S.myRecipes.map(function (x) { return x.id; }).indexOf(r.id);
    if (i >= 0) S.myRecipes[i] = r; else S.myRecipes.unshift(r);
    return r;
  }

  /* ===== الأوراق السفلية ===== */
  function sheetHtml(sh) {
    var h = '<div class="backdrop" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(sheetTitle(sh)) + '"><span class="grab" aria-hidden="true"></span>';
    if (sh.type === 'add') h += addSheet(sh);

      h += '<div class="timer' + (t.ring ? ' ding' : '') + '" id="tmr"><div class="ring"><svg width="184" height="184" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--cook-track)" stroke-width="7"/>' +
        '<circle id="tArc" cx="60" cy="60" r="52" fill="none" stroke="var(--saffron)" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - frac)).toFixed(1) + '" transform="rotate(-90 60 60)"/></svg>' +
        '<div class="face" role="timer" aria-live="off"><span class="t" id="tT">' + fmtSec(left) + '</span><span class="l">' + (t.ring ? 'خلص الوقت!' : 'من ' + fmtSec(t.dur)) + '</span></div></div>' +
        '<div class="tctl"><button type="button" class="round" data-act="tReset" aria-label="إعادة المؤقت">' + svg('reset', 22) + '</button>' +

      '<button type="button" class="next" data-act="cookNext">' + (isLast ? svg('check', 18) + 'خلصت الطبخ' : 'الخطوة التالية' + svg('chevL', 18)) + '</button></div>';

  }
  function fmtSec(s) {

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function timerLeft(t) { return t.endAt ? Math.max(0, (t.endAt - Date.now()) / 1000) : t.left; }
  function curTimer(create) {
    var c = ui.cook, r = L.recipe(S, c.rid), st = r.steps[c.i];
    if (!st.min) return null;
    if (!c.timers[c.i] && create) c.timers[c.i] = { dur: st.min * 60, left: st.min * 60, endAt: null, ring: false };

  }
  function startTimer() { var t = curTimer(true); if (t && !t.endAt && !t.ring) { if (t.left <= 0) t.left = t.dur; t.endAt = Date.now() + t.left * 1000; } }
  function pauseTimer() { var t = curTimer(false); if (t && t.endAt) { t.left = timerLeft(t); t.endAt = null; } }

  var wake = null, wakeOk = null;
  function awakeText() {

      }).catch(function () { wakeOk = false; updAwake(); });
    } catch (e) { wakeOk = false; updAwake(); }
  }
  function releaseWake() { try { if (wake) wake.release(); } catch (e) { /* */ } wake = null; wakeOk = null; }
  function updAwake() { var el = $('#awake'); if (el) el.innerHTML = svg('phone', 16) + awakeText(); }

  /* الصوت: تنبيه المؤقت */
  var actx = null, alarmTimer = null;
  function unlockAudio() {
    try {
      var A = window.AudioContext || window.webkitAudioContext;
      if (!A) return;
      if (!actx) actx = new A();
      if (actx.state === 'suspended') actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      g.gain.value = 0.0001; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.02);
    } catch (e) { /* */ }
  }
  function beep() {
    if (!actx) return;
    try {
      [0, 0.28, 0.56].forEach(function (d) {
        var o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + d;
        o.type = 'sine'; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
        o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + 0.25);

    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* */ }
  }
  function syncAlarm() {
    var any = ui.cook && Object.keys(ui.cook.timers).some(function (k) { return ui.cook.timers[k].ring; });
    if (any && !alarmTimer) { beep(); alarmTimer = setInterval(beep, 1600); }
    if (!any && alarmTimer) { clearInterval(alarmTimer); alarmTimer = null; }
  }

  function tick() {
    var c = ui.cook;
    if (!c) return;
    var changed = false;
    Object.keys(c.timers).forEach(function (k) {
      var t = c.timers[k];
      if (t.endAt && Date.now() >= t.endAt) { t.endAt = null; t.left = 0; t.ring = true; changed = true; }
    });
    if (changed) { syncAlarm(); renderCook(); return; }
    var t = c.timers[c.i];
    if (t && t.endAt) {
      var left = timerLeft(t), el = $('#tT'), arc = $('#tArc');

  }

  /* الأوامر الصوتية */

      rec = new SR();

        var txt = L.norm(e.results[e.results.length - 1][0].transcript);

        else if (/السابق|ارجع|رجوع|قبل/.test(txt)) cookMove(-1);
        else if (/وقف|ايقاف|اوقف|تمام/.test(txt)) { ackAll(); pauseTimer(); renderCook(); }
        else if (/شغل|ابدا|مؤقت|موقت/.test(txt)) { startTimer(); renderCook(); }
      };
      rec.onerror = function (e) {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') {
          stopVoice(); if (ui.cook) { ui.cook.voice = false; renderCook(); }
          toast('ما قدرت أشغّل المايك. تقدر تكمل باللمس.');
        }
      };
      rec.onend = function () { if (ui.cook && ui.cook.voice) { setTimeout(function () { try { rec && rec.start(); } catch (e) { /* */ } }, 300); } };
      rec.start();
    } catch (e) { rec = null; if (ui.cook) ui.cook.voice = false; toast('الأوامر الصوتية ما تشتغل على هذا الجهاز.'); }
  }
  function stopVoice() { var r = rec; rec = null; try { if (r) { r.onend = null; r.stop(); } } catch (e) { /* */ } }

  }
  function cookMove(d) {

  function renderMain() {
    var el = $('#main');
    var scr = $('#scr'), top = scr ? scr.scrollTop : 0;
    var html = ui.tab === 'home' ? homeHtml() : ui.tab === 'pantry' ? pantryHtml() : ui.tab === 'shop' ? shopHtml() : mineHtml();
    el.innerHTML = '<main class="screen" id="scr">' + html + '</main>' + nav();
    var ns = $('#scr'); if (ns) ns.scrollTop = top;
  }
  function renderOv() {
    var el = $('#ov'), o = ui.overlay;
    var b = $('#rbody') || $('#ebody') || $('.form-body', el), top = b ? b.scrollTop : 0;
    if (!o) { el.innerHTML = ''; return; }
    el.innerHTML = o.type === 'recipe' ? recipePage(o) : o.type === 'editor' ? editorPage(o) : settingsPage();
    var nb = $('#rbody') || $('#ebody') || $('.form-body', el); if (nb && o.keepScroll) nb.scrollTop = top;
    o.keepScroll = true;
  }
  function renderCook() { $('#ck').innerHTML = ui.cook ? cookHtml() : ''; }
  function renderSheet() {
    var el = $('#sh');
    var s = $('.sheet', el), top = s ? s.scrollTop : 0;
    el.innerHTML = ui.sheet ? sheetHtml(ui.sheet) : '';
    var ns = $('.sheet', el); if (ns) ns.scrollTop = top;
  }
  function refresh() { renderMain(); renderOv(); renderCook(); renderSheet(); }
  function changed() { save(); refresh(); }

  function openRecipe(id) {
    ui.overlay = { type: 'recipe', id: id, persons: S.settings.persons, tab: 'ing' };
    renderOv();
  }
  function closeOverlay() { ui.overlay = null; renderOv(); renderMain(); }
  function closeSheet() { ui.sheet = null; renderSheet(); }
  function openConfirm(title, body, ok, danger, fn) { ui.sheet = { type: 'confirm', title: title, body: body, ok: ok, danger: danger, fn: fn }; renderSheet(); }

  function addMissing(rid) {
    var r = L.recipe(S, rid), a = L.analyze(S, r, Date.now());
    if (!a.missingReq.length) return;
    var snap = snapshot();
    a.missingReq.forEach(function (id) { L.addShopping(S, { ingId: id, from: r.name }); });
    changed();
    toast('انضاف للقائمة: ' + names(a.missingReq), function () { restore(snap); });
  }

  /* ===== النسخ الاحتياطي ===== */
  function markBackup() { S.lastBackup = Date.now(); changed(); }
  function exportBackup() {
    var txt = L.exportData(S);
    var d = new Date(), name = 'wash-atbukh-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.json';
    if (FRAMED) { ui.sheet = { type: 'backupText', mode: 'export', text: txt }; renderSheet(); return; }
    var file = null;
    try { file = new File([txt], name, { type: 'application/json' }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'نسخة وش أطبخ؟' }).then(function () { markBackup(); toast('انحفظت النسخة'); })
        .catch(function (err) { if (!err || err.name !== 'AbortError') { ui.sheet = { type: 'backupText', mode: 'export', text: txt }; renderSheet(); } });
      return;
    }
    try {
      var url = URL.createObjectURL(new Blob([txt], { type: 'application/json' }));
      var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
      markBackup(); toast('انحفظت النسخة باسم ' + name);
    } catch (e) { ui.sheet = { type: 'backupText', mode: 'export', text: txt }; renderSheet(); }
  }
  function askImport(text) {
    var st;
    try { st = L.importData(text); } catch (e) { toast('هذا الملف مو نسخة من وش أطبخ؟'); return; }
    openConfirm('تسترجع هذي النسخة؟', 'بتنحط بدال بياناتك الحالية: ' + Object.keys(st.pantry).length + ' مكون، ' + st.myRecipes.length + ' وصفة لك، ' + st.history.length + ' مرة طبخ.', 'استرجع', false, function () {
      var snap = snapshot();
      S = st; S.demo = false; save(); ui.overlay = null; ui.sheet = null; refresh();
      toast('رجعت النسخة', function () { restore(snap); });
    });
  }

  /* ===== الأوامر ===== */
  function act(a, el, e) {
    var id = el.getAttribute('data-id'), v = el.getAttribute('data-v');
    var snap;
    switch (a) {
      case 'tab': ui.tab = v; ui.showAll = false; renderMain(); var sc = $('#scr'); if (sc) sc.scrollTop = 0; break;
      case 'undo': if (toast.undo) { var u = toast.undo; toast.undo = null; $('#toast').innerHTML = ''; u(); } break;
      case 'settings': ui.overlay = { type: 'settings' }; renderOv(); break;
      case 'close': closeOverlay(); break;
      case 'backdrop': if (e.target === el) closeSheet(); break;
      case 'closeSheet':
        closeSheet(); renderMain(); renderOv();
        break;
      case 'confirmOk': var fn = ui.sheet.fn; closeSheet(); fn(); break;
      case 'hideInstall': S.installTipOff = true; changed(); break;

      /* الفلاتر */
      case 'meal': setF('meal', v || null); break;
      case 'time': setF('maxTime', v ? +v : null); break;
      case 'easy': setF('diff', v ? +v : null); break;
      case 'cuisine': setF('cuisine', v || null); break;
      case 'useExp': ui.f.useExpiring = !ui.f.useExpiring; afterFilter(); break;
      case 'clearFilters': ui.f = { meal: null, maxTime: null, diff: null, cuisine: null, q: '', useExpiring: false }; if (ui.sheet && ui.sheet.type === 'filters') closeSheet(); renderMain(); break;
      case 'filters': ui.sheet = { type: 'filters' }; renderSheet(); break;
      case 'showAll': ui.showAll = !ui.showAll; $('#results').innerHTML = resultsHtml(); break;
      case 'defP': S.settings.persons = Math.max(1, Math.min(30, S.settings.persons + (+v))); save(); renderSheet(); renderOv(); break;

      /* الوصفات */
      case 'open': openRecipe(id); break;
      case 'fav': if (S.favs[id]) delete S.favs[id]; else S.favs[id] = Date.now(); save(); renderOv(); toast(S.favs[id] ? 'انضافت للمفضلة' : 'انشالت من المفضلة'); break;
      case 'pers': ui.overlay.persons = Math.max(1, Math.min(30, ui.overlay.persons + (+v))); renderOv(); break;
      case 'rtab': ui.overlay.tab = v; renderOv(); break;
      case 'addmiss': addMissing(id); break;
      case 'cook': openCook(ui.overlay.id, ui.overlay.persons); break;

      /* وضع الطبخ */
      case 'cookNext': cookMove(1); break;
      case 'cookPrev': cookMove(-1); break;
      case 'cookGo': ui.cook.i = +v; renderCook(); break;
      case 'cookEnd': ackAll(); closeCook(); break;
      case 'tToggle': unlockAudio(); var tt = curTimer(true); if (tt.endAt) pauseTimer(); else startTimer(); renderCook(); break;
      case 'tReset': var tr = curTimer(true); tr.endAt = null; tr.left = tr.dur; tr.ring = false; syncAlarm(); renderCook(); break;
      case 'tAdd': var ta = curTimer(true); if (ta.ring) { ta.ring = false; ta.left = 0; syncAlarm(); } ta.dur += 60; if (ta.endAt) ta.endAt += 60000; else ta.left += 60; renderCook(); break;
      case 'tAck': ackAll(); renderCook(); break;
      case 'voice':
        ui.cook.voice = !ui.cook.voice; S.settings.voice = ui.cook.voice; save();
        if (ui.cook.voice) startVoice(); else stopVoice();
        renderCook(); break;
      case 'voicePref': S.settings.voice = !S.settings.voice; save(); renderOv(); break;

      /* بعد الطبخ */
      case 'finCh': ui.sheet.choices[id] = v; renderSheet(); break;
      case 'finShop': ui.sheet.addShop = el.checked; break;
      case 'finSkip': case 'finSave':
        var sh = ui.sheet, r = L.recipe(S, sh.rid);
        var used = a === 'finSkip' ? [] : Object.keys(sh.choices).filter(function (k) { return sh.choices[k] !== 'keep'; }).map(function (k) { return { id: k, action: sh.choices[k] }; });
        L.logCooked(S, sh.rid, used);
        if (a === 'finSave' && sh.addShop) used.filter(function (u) { return u.action === 'gone'; }).forEach(function (u) { L.addShopping(S, { ingId: u.id }); });
        ui.sheet = null; ui.overlay = null; changed();
        toast('انسجلت «' + r.name + '» في وش طبخنا');
        break;

      /* المطبخ */
      case 'pseg': ui.pantrySeg = v; renderMain(); break;
      case 'addSheet': ui.sheet = { type: 'add', q: '' }; renderSheet(); focusLater('#addq'); break;
      case 'addBasic': ui.sheet = { type: 'add', q: '', mode: 'basic' }; renderSheet(); focusLater('#addq'); break;
      case 'toggleIng':
        if (ui.sheet.mode === 'basic') {
          var bi = S.basics.indexOf(id);
          if (bi >= 0) S.basics.splice(bi, 1); else S.basics.push(id);
        } else if (S.pantry[id]) L.removePantry(S, id);
        else L.setPantry(S, id, 'have');
        save(); $('#addres').innerHTML = addRes(ui.sheet);
        break;
      case 'newIng': ui.sheet.newName = (ui.sheet.q || '').trim(); $('#addres').innerHTML = addRes(ui.sheet); break;
      case 'newIngCat':
        var ni = L.addCustomIng(S, ui.sheet.newName, v);
        L.setPantry(S, ni.id, 'have');
        ui.sheet.newName = null; ui.sheet.q = ''; save(); renderSheet(); toast('انضاف «' + ni.name + '» لمطبخك'); focusLater('#addq');
        break;
      case 'ing': ui.sheet = { type: 'ing', id: id }; renderSheet(); break;
      case 'setSt': L.setPantry(S, ui.sheet.id, v); changed(); break;
      case 'exp':
        var cur = Math.max(0, L.daysLeft(S, ui.sheet.id, Date.now()));
        L.setExpiry(S, ui.sheet.id, Math.max(0, cur + (+v))); changed(); break;
      case 'expOff': L.setExpiry(S, ui.sheet.id, null); changed(); break;
      case 'expOn': var inf = L.ing(S, ui.sheet.id); L.setExpiry(S, ui.sheet.id, inf && inf.perish ? inf.perish : 3); changed(); break;
      case 'rmIng':
        snap = snapshot(); var rn = L.ingName(S, ui.sheet.id);
        L.removePantry(S, ui.sheet.id); ui.sheet = null; changed();
        toast('انشال «' + rn + '» من مطبخك', function () { restore(snap); }); break;
      case 'gone2shop':
        snap = snapshot(); var gid = ui.sheet.id;
        L.removePantry(S, gid); L.addShopping(S, { ingId: gid }); ui.sheet = null; changed();
        toast('«' + L.ingName(S, gid) + '» راح للقائمة', function () { restore(snap); }); break;
      case 'clearDemo':
        snap = snapshot();
        S.pantry = {}; S.demo = false; ui.overlay = null; save();
        ui.tab = 'pantry'; ui.sheet = { type: 'add', q: '' }; refresh();
        toast('انمسح المطبخ التجريبي', function () { restore(snap); });
        break;
      case 'rmBasic': S.basics.splice(S.basics.indexOf(id), 1); changed(); break;

      /* المشتريات */
      case 'delShop':
        e.preventDefault();
        snap = snapshot(); S.shopping = S.shopping.filter(function (s) { return s.id !== id; }); changed();
        toast('انشال من القائمة', function () { restore(snap); }); break;
      case 'clearDone':
        snap = snapshot(); L.clearDone(S); changed(); toast('انمسح المشطوب', function () { restore(snap); }); break;

      /* وصفاتي */
      case 'mseg': ui.mineSeg = v; renderMain(); break;
      case 'newRecipe': ui.overlay = { type: 'editor', draft: blankDraft() }; renderOv(); focusLater('#e-name'); break;
      case 'editRecipe': ui.overlay = { type: 'editor', draft: draftFrom(L.recipe(S, id)) }; renderOv(); break;
      case 'eMeal': var dm = ui.overlay.draft.meals, mi = dm.indexOf(v); if (mi >= 0) dm.splice(mi, 1); else dm.push(v); renderOv(); break;
      case 'eAddIng': ui.overlay.draft.ing.push({ name: '', qty: '', unit: 'حبة', opt: false }); renderOv(); focusLater('#e-in-' + (ui.overlay.draft.ing.length - 1)); break;
      case 'eDelIng': ui.overlay.draft.ing.splice(+v, 1); renderOv(); break;
      case 'eAddStep': ui.overlay.draft.steps.push({ t: '', min: '' }); renderOv(); focusLater('#e-st-' + (ui.overlay.draft.steps.length - 1)); break;
      case 'eDelStep': ui.overlay.draft.steps.splice(+v, 1); renderOv(); break;
      case 'saveRecipe':
        var res = saveDraft(ui.overlay.draft);
        if (typeof res === 'string') { ui.overlay.draft.err = res; renderOv(); var eb = $('#ebody'); if (eb) eb.scrollTop = 0; break; }
        save(); ui.mineSeg = 'mine'; ui.overlay = { type: 'recipe', id: res.id, persons: S.settings.persons, tab: 'ing' }; refresh(); toast('انحفظت «' + res.name + '»');
        break;
      case 'delRecipe':
        var did = ui.overlay.draft.id;
        openConfirm('تحذف هذي الوصفة؟', 'ما تقدر ترجعها بعد الحذف، إلا من نسخة احتياطية.', 'احذف', true, function () {
          S.myRecipes = S.myRecipes.filter(function (x) { return x.id !== did; }); delete S.favs[did];
          ui.overlay = null; changed(); toast('انحذفت الوصفة');
        });
        break;

      /* الإعدادات */
      case 'export': exportBackup(); break;
      case 'importText': ui.sheet = { type: 'backupText', mode: 'import', text: '' }; renderSheet(); focusLater('#bkText'); break;
      case 'pasteBackup': var t = $('#bkText').value; closeSheet(); askImport(t); break;
      case 'copyBackup':
        var ta2 = $('#bkText');
        var done = function () { markBackup(); toast('انسخت. احفظها في ملاحظاتك.'); };
        try {
          navigator.clipboard.writeText(ta2.value).then(done, function () { ta2.focus(); ta2.select(); toast('النص محدد. انسخه يدوياً.'); });
        } catch (err) { ta2.focus(); ta2.select(); toast('النص محدد. انسخه يدوياً.'); }
        break;
      case 'wipe':
        openConfirm('تمسح كل شي؟', 'بينمسح المطبخ والقائمة ووصفاتك والسجل من هذا الجوال.', 'امسح كل شي', true, function () {
          S = L.newState(); S.onboarded = true; ui.overlay = null; ui.tab = 'pantry'; save(); refresh(); toast('بدأت من جديد');
        });
        break;
    }
  }
  function setF(k, val) {
    if (!(ui.sheet && ui.sheet.type === 'filters') && ui.f[k] === val) ui.f[k] = null; else ui.f[k] = val;
    afterFilter();
  }
  function afterFilter() {
    ui.showAll = false;
    if (ui.sheet && ui.sheet.type === 'filters') renderSheet();
    renderMain();
  }
  function focusLater(sel) { setTimeout(function () { var el = $(sel); if (el) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } } }, 60); }

  /* ===== الأحداث ===== */
  function bind() {
    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-act]');
      if (!t || t.disabled) return;
      if (t.tagName === 'INPUT') return;
      act(t.getAttribute('data-act'), t, e);
    });
    document.addEventListener('change', function (e) {
      var t = e.target;
      if (t.matches('[data-act="toggleShop"]')) {
        var it = L.toggleShopping(S, t.getAttribute('data-id'));
        changed();
        if (it && it.done) toast('«' + it.name + '» انضاف لمطبخك');
        return;
      }
      if (t.matches('[data-act="finShop"]')) { ui.sheet.addShop = t.checked; return; }
      if (t.id === 'impFile' && t.files && t.files[0]) {
        var fr = new FileReader();
        fr.onload = function () { askImport(String(fr.result)); };
        fr.readAsText(t.files[0]);
        t.value = '';
        return;
      }
      if (t.hasAttribute('data-f') && ui.overlay && ui.overlay.draft) setDraftField(ui.overlay.draft, t.getAttribute('data-f'), t);
    });
    document.addEventListener('input', function (e) {
      var t = e.target;
      if (t.id === 'q') { ui.f.q = t.value; ui.showAll = false; var r = $('#results'); if (r) r.innerHTML = resultsHtml(); return; }
      if (t.id === 'addq') { ui.sheet.q = t.value; ui.sheet.newName = null; $('#addres').innerHTML = addRes(ui.sheet); return; }
      if (t.hasAttribute('data-f') && ui.overlay && ui.overlay.draft) setDraftField(ui.overlay.draft, t.getAttribute('data-f'), t);
    });
    document.addEventListener('submit', function (e) {
      if (e.target.id !== 'shopForm') return;
      e.preventDefault();
      var inp = $('#shopIn'), v = inp.value.trim();
      if (!v) return;
      var f = L.findIng(S, v);
      L.addShopping(S, f.exact ? { ingId: f.exact.id } : { name: v });
      changed();
      focusLater('#shopIn');
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (ui.sheet) closeSheet();
      else if (ui.cook) { ackAll(); closeCook(); }
      else if (ui.overlay) closeOverlay();
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && ui.cook) { requestWake(); tick(); renderCook(); }
    });
    setInterval(tick, 250);
  }

  function registerSW() {
    if (FRAMED || !('serviceWorker' in navigator) || location.protocol !== 'https:' && location.hostname !== 'localhost') return;
    try {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function () {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('نزل تحديث جديد. افتح التطبيق مرة ثانية عشان يشتغل.');
          });
        });
      }).catch(function () { /* */ });
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { /* */ });
    } catch (e) { /* */ }
  }

  function start() {
    load();
    var app = document.getElementById('app');
    app.innerHTML = '<div id="main" style="display:contents"></div><div id="ov"></div><div id="ck"></div><div id="sh"></div><div id="toast" aria-live="polite"></div>';
    bind();
    refresh();
    registerSW();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
